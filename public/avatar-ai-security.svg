    <path d="M170 55 H150 V35" />
    <circle cx="150" cy="35" r="3" fill="#38bdf8" stroke="none" />
  </g>

  <!-- 방패(보안) -->
  <path d="M100 45 L142 62 V100 C142 128 124 148 100 158 C76 148 58 128 58 100 V62 Z"
